# EchoMap frontend: serves the built SPA and reverse-proxies the API + WebSocket
# hub to the `app` role, so the browser talks to one origin (PRD §3b). Same-origin
# is what keeps the HttpOnly session cookie and the same-origin WS working.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip static assets (the Recharts-heavy bundle benefits most).
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # REST API -> app role.
    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Liveness passthrough (used by ops / uptime checks).
    location = /healthz {
        proxy_pass http://app:8080;
    }

    # WebSocket hub — needs the HTTP/1.1 Upgrade dance and a long read timeout so
    # idle live connections aren't culled mid-session.
    location /ws {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA client-side routing: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
